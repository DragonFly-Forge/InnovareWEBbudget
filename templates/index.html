<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SSY | Smart Savings for Youth</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #000; --card: #111; --blue: #00f2ff; --purple: #bc13fe; --green: #39ff14; --red: #ff4d4d; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(0,242,255,0.2); border-radius: 15px; padding: 20px; width: 400px; margin-bottom: 20px; }
        .neon-text { color: var(--blue); text-shadow: 0 0 10px var(--blue); }
        .savings-hero { text-align: center; border: 1px solid var(--green); box-shadow: 0 0 20px rgba(57,255,20,0.1); transition: 0.5s; }
        .percent { font-size: 3.5rem; color: var(--green); font-weight: 800; text-shadow: 0 0 15px var(--green); }
        input, select { background: #000; color: #fff; border: 1px solid #333; padding: 10px; width: 94%; margin: 10px 0; border-radius: 5px; }
        button { width: 100%; padding: 12px; font-weight: bold; cursor: pointer; border-radius: 5px; border: none; transition: 0.3s; margin-top: 10px; }
        .btn-blue { background: var(--blue); color: #000; box-shadow: 0 0 10px var(--blue); }
        .btn-red { background: transparent; border: 1px solid var(--red); color: var(--red); }
        .btn-red:hover { background: var(--red); color: #000; }
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; display: flex; justify-content: center; align-items: center; }
        table { width: 100%; max-width: 800px; border-collapse: collapse; margin-top: 20px; }
        th { border-bottom: 1px solid var(--purple); color: var(--purple); padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #222; }
        #portfolio-list { max-height: 150px; overflow-y: auto; margin-bottom: 10px; font-size: 0.85rem; border: 1px solid #222; padding: 5px; border-radius: 5px; }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="glass" style="text-align: center;">
        <h1 class="neon-text">SSY LOGIN</h1>
        <input type="text" id="l-user" placeholder="Username">
        <input type="password" id="l-pass" placeholder="Password">
        <button class="btn-blue" onclick="login()">AUTHORIZE</button>
        <hr style="margin: 20px 0; border: 0.5px solid #333;">
        <h3 class="neon-text" style="color: var(--purple); text-shadow: 0 0 10px var(--purple);">REGISTER</h3>
        <input type="text" id="r-user" placeholder="New Username">
        <input type="password" id="r-pass" placeholder="New Password">
        <input type="number" id="r-budget" placeholder="Monthly Budget (₹)">
        <button class="btn-blue" style="background: var(--purple); box-shadow: 0 0 10px var(--purple);" onclick="register()">CREATE ACCOUNT</button>
    </div>
</div>

<h1 class="logo neon-text">SSY.DASHBOARD</h1>

<div class="glass savings-hero">
    <div style="font-size: 0.8rem; letter-spacing: 2px;">SAVINGS STRENGTH</div>
    <div id="savings-percent" class="percent">0%</div>
    <div id="status-text" style="font-size: 0.7rem; color: var(--green); margin-bottom: 10px;">OPTIMAL: SAVINGS SECURE</div>
    <div style="display: flex; justify-content: space-around; margin-top: 15px;">
        <div><div style="color:var(--blue)">INCOME</div><div id="t-inc">₹0</div></div>
        <div><div style="color:var(--purple)">DAILY LIMIT</div><div id="t-lim">₹0</div></div>
    </div>
</div>

<div style="display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;">
    <div class="glass">
        <h3 class="neon-text">LOG TRANSACTION</h3>
        <input type="text" id="desc" placeholder="Description">
        <input type="number" id="amt" placeholder="Amount (₹)">
        <select id="cat">
            <option value="1">Food</option><option value="2">Travel</option><option value="3">Shopping</option><option value="4">Education</option>
        </select>
        <button class="btn-blue" onclick="submit('expense')">ADD EXPENSE</button>
        <button class="btn-blue" style="background:var(--green); box-shadow:0 0 10px var(--green);" onclick="submit('income')">ADD INCOME</button>
    </div>

    <div class="glass" style="border-color: var(--purple);">
        <h3 class="neon-text" style="color: var(--purple); text-shadow: 0 0 10px var(--purple);">INVESTMENT CENTER</h3>
        <div id="portfolio-list"><p style="color: #666; text-align: center;">Simulation mode active...</p></div>
        <input type="text" id="i-asset" placeholder="Asset (e.g., Apple)">
        <input type="number" id="i-amt" placeholder="Invest Amount (₹)">
        <button class="btn-blue" style="background: var(--purple); box-shadow: 0 0 10px var(--purple);" onclick="invest()">INITIALIZE INVESTMENT</button>
    </div>
    
    <div class="glass">
        <h3 class="neon-text">SYSTEM TOOLS</h3>
        <button class="btn-blue" style="background: var(--purple); box-shadow: 0 0 10px var(--purple);" onclick="downloadReport()">DOWNLOAD CSV REPORT</button>
        <button class="btn-red" onclick="wipe()">WIPE DATA</button>
        <button class="btn-red" style="margin-top: 20px;" onclick="logout()">TERMINATE SESSION</button>
    </div>
    
    <div class="glass">
        <h3 class="neon-text">VISUAL ANALYTICS</h3>
        <select id="chart-selector" onchange="load()" style="margin-bottom: 15px; border-color: var(--blue);">
            <option value="doughnut">Doughnut: Category Breakdown</option>
            <option value="bar">Bar: Expense Comparison</option>
            <option value="line">Line: Spending Trend</option>
        </select>
        <canvas id="chart"></canvas>
    </div>
</div>

<table id="h-table">
    <thead><tr><th>Date</th><th>Item</th><th>Category</th><th>Amount</th></tr></thead>
    <tbody></tbody>
</table>

<script>
    const API_BASE = "https://innovarewebbudget.onrender.com"; // Your live URL
    let currentUserId = null;
    let chart;

    async function login() {
        const username = document.getElementById('l-user').value;
        const password = document.getElementById('l-pass').value;
        try {
            const res = await fetch(`${API_BASE}/api/login`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            if (res.ok) {
                currentUserId = (await res.json()).user_id;
                document.getElementById('auth-overlay').style.display = 'none';
                load();
            } else alert("Access Denied: Invalid Credentials");
        } catch (e) { alert("Server is waking up... try again in 30 seconds."); }
    }

    async function register() {
        const username = document.getElementById('r-user').value;
        const password = document.getElementById('r-pass').value;
        const budget = document.getElementById('r-budget').value;
        const res = await fetch(`${API_BASE}/api/register`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password, budget: parseFloat(budget)})
        });
        if(res.ok) alert("Account Created! Use Login above.");
        else alert("Registration Failed");
    }

    async function submit(type) {
        const route = type === 'income' ? '/api/add-income' : '/api/add-transaction';
        await fetch(`${API_BASE}${route}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                user_id: currentUserId,
                category_id: parseInt(document.getElementById('cat').value),
                amount: parseFloat(document.getElementById('amt').value),
                description: document.getElementById('desc').value
            })
        });
        load();
    }

    function invest() {
        alert("Investment Center is in simulation mode for this demo version.");
    }

    function downloadReport() { 
        window.location.href = `${API_BASE}/api/export/${currentUserId}`; 
    }

    function logout() { 
        currentUserId = null; 
        document.getElementById('auth-overlay').style.display = 'flex'; 
    }

    async function wipe() { 
        if (confirm("Permanently wipe all transaction data?")) { 
            await fetch(`${API_BASE}/api/clear-data/${currentUserId}`, {method: 'DELETE'}); 
            load(); 
        } 
    }

    async function load() {
        if(!currentUserId) return;

        // Fetch Smart Summary
        const sRes = await fetch(`${API_BASE}/api/smart-summary/${currentUserId}`);
        const s = await sRes.json();
        
        const savings = s.total_income > 0 ? (((s.total_income - s.total_spent) / s.total_income) * 100).toFixed(1) : 0;
        document.getElementById('savings-percent').innerText = `${savings}%`;
        document.getElementById('t-inc').innerText = `₹${s.total_income || 0}`;
        document.getElementById('t-lim').innerText = `₹${s.daily_limit || 0}`;

        // Fetch Transaction History
        const tRes = await fetch(`${API_BASE}/api/transactions/${currentUserId}`);
        const tData = await tRes.json();
        const body = document.querySelector('#h-table tbody');
        body.innerHTML = '';
        
        const catData = {};
        const trendData = {};

        tData.forEach(t => {
            if (t.type === 'expense') {
                catData[t.category] = (catData[t.category] || 0) + t.amount;
                trendData[t.date] = (trendData[t.date] || 0) + t.amount;
            }
            body.insertAdjacentHTML('beforeend', `
                <tr>
                    <td>${t.date}</td>
                    <td>${t.description}</td>
                    <td>${t.category}</td>
                    <td style="color:${t.type==='income'?'#39ff14':'#ff4d4d'}">
                        ${t.type==='income'?'+':'-'}₹${t.amount}
                    </td>
                </tr>`);
        });

        updateChart(catData, trendData);
    }

    function updateChart(catData, trendData) {
        const ctx = document.getElementById('chart').getContext('2d');
        const type = document.getElementById('chart-selector').value;
        if (chart) chart.destroy();

        let labels, values, bgColor, borderColor;

        if (type === 'line') {
            labels = Object.keys(trendData).sort();
            values = labels.map(date => trendData[date]);
            bgColor = 'rgba(0, 242, 255, 0.2)';
            borderColor = '#00f2ff';
        } else {
            labels = Object.keys(catData);
            values = Object.values(catData);
            bgColor = ['#00f2ff', '#bc13fe', '#39ff14', '#f1c40f'];
            borderColor = 'transparent';
        }

        chart = new Chart(ctx, {
            type: type === 'line' ? 'line' : (type === 'bar' ? 'bar' : 'doughnut'),
            data: {
                labels: labels,
                datasets: [{
                    label: 'Expenses (₹)',
                    data: values,
                    backgroundColor: bgColor,
                    borderColor: borderColor,
                    borderWidth: type === 'line' ? 2 : 0,
                    tension: 0.3,
                    fill: type === 'line'
                }]
            },
            options: {
                plugins: { legend: { labels: { color: '#fff' } } },
                scales: type !== 'doughnut' ? {
                    y: { grid: { color: '#222' }, ticks: { color: '#fff' } },
                    x: { grid: { color: '#222' }, ticks: { color: '#fff' } }
                } : {}
            }
        });
    }
</script>
</body>
</html>
